name: Archive

on:
  schedule:
    - cron: '5 4 * * sun'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    container: perl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: build
        run: |
          apt -qqq update
          apt -qqq install nodejs zip gh
          cpanm -qn Data::Mirror LWP::Protocol::https HTML5::DOM Image::Size Lingua::EN::Titlecase Template::Liquid File::Copy::Recursive

          ./bfgdata.pl

          zip -r archive.zip _site

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TAG="v$(date -u '+%Y%m%d').${RUN_ID}"

          git config --global --add safe.directory \*

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_release.outputs.tag }}
          files: archive.zip
