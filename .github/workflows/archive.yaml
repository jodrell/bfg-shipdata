name: Archive

on:
#  schedule:
#    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          TIMESTAMP=$(date -u -d "$RUN_STARTED_AT" '+%Y%m%d%H%M%S')
          TAG="daily-${TIMESTAMP}-${RUN_ID}"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes